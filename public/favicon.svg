<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- 背景渐变：暖金琥珀到珊瑚橙红 -->
    <linearGradient id="adminBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- 顶部玻璃微光感 -->
    <linearGradient id="adminShineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 外部立体投影 -->
    <filter id="adminDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#c2410c" flood-opacity="0.32"/>
    </filter>

    <!-- 文字柔和阴影 -->
    <filter id="adminTextShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#9a3412" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 底板圆角 Squircle (iOS 风格优雅超椭圆) -->
  <rect x="8" y="8" width="112" height="112" rx="27" fill="url(#adminBgGrad)" filter="url(#adminDropShadow)"/>

  <!-- 内嵌微边框 -->
  <rect x="9.5" y="9.5" width="109" height="109" rx="25.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- 上半部微光 -->
  <path d="M 8 35 C 8 20.088 20.088 8 35 8 L 93 8 C 107.912 8 120 20.088 120 35 L 120 64 L 8 64 Z" fill="url(#adminShineGrad)"/>

  <!-- 右上角闪耀四角星 (Sparkles 品牌呼应) -->
  <!-- 主星 -->
  <path d="M 100 16 Q 100 24 108 24 Q 100 24 100 32 Q 100 24 92 24 Q 100 24 100 16 Z" fill="#ffffff" opacity="0.95"/>
  <!-- 副微星 -->
  <path d="M 110 33 Q 110 36 113 36 Q 110 36 110 39 Q 110 36 107 36 Q 110 36 110 33 Z" fill="#fef08a" opacity="0.85"/>

  <!-- 核心汉字「字」 -->
  <text
    x="64"
    y="86"
    font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
    font-size="68"
    font-weight="900"
    text-anchor="middle"
    fill="#ffffff"
    filter="url(#adminTextShadow)"
    letter-spacing="-1"
  >字</text>
</svg>
